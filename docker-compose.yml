version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: axly_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-axly_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-axly_local_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bind to localhost only to avoid accidental exposure on public interfaces
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-axly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axly_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      # Use DATABASE_URL if provided (e.g., Supabase Cloud), otherwise connect to containerized Postgres
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-axly_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-axly_local_dev_password}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-axly_docker_local_secret_must_be_32_chars_long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SHORT_DOMAIN: ${SHORT_DOMAIN:-http://localhost:5000}
      TRUST_PROXY: "1"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: axly_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
