version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: axly_postgres
    environment:
      POSTGRES_DB: axly_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: axly_secret_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: axly_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axly_db
      DB_USER: postgres
      DB_PASSWORD: axly_secret_2026
      JWT_SECRET: change_this_in_production_axly_jwt_secret_2026
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost
      SHORT_DOMAIN: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: axly_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
